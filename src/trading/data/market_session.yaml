# 시장별 정규장 세션 (하드코딩 금지 — 가드 로직과 분리된 데이터).
# 새 시장(US 등) 추가 시 이 파일에 항목만 추가하면 market_session.py 코드는 불변.
#
# open  : 정규장 개장 시각 (해당 시장 현지시간, HH:MM)
# close : 정규장 마감 시각 (해당 시장 현지시간, HH:MM) — 경계는 [open, close) 반개구간.
#         close 정각은 이미 마감이므로 주문 불가로 취급한다.
# tz    : IANA 타임존. 현지시간 판정에 쓴다.
#
# 주의: 시간외 단일가·프리마켓/애프터마켓은 이 시스템의 매매 대상이 아니므로
# 포함하지 않는다. 정규장만 기술한다.

KR:
  open: "09:00"
  close: "15:30"
  tz: "Asia/Seoul"

# 미국 정규장. 서머타임은 IANA 타임존이 자동 처리하므로 현지시간 그대로 적는다.
# [확인 필요]: US 거래일 달력(미국 공휴일)은 아직 미구현 —
# scheduler.calendar.is_trading_day 는 KRX 기준이다. US 매매 개시 전 반드시 보강할 것.
US:
  open: "09:30"
  close: "16:00"
  tz: "America/New_York"
